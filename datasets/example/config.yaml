dataset: data.csv
package_name: IGBTSurrogate
inputs: [Vge, Ic, Tj]
outputs: [Vce, Eon]
connectors:
  inputs: {}
  outputs: {}
training:
  epochs: 500
  batch_size: 32
  learning_rate: 0.001
  patience: 40
  # hidden_layers: [128, 128, 64]  # optional: override network size per dataset
tolerance:
  rtol: 1.0e-4
  atol: 1.0e-6
